name: Julkaise Päivän säkeet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nouda lähteet
        uses: actions/checkout@v7
      - name: Asenna Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Valmistele Pages
        uses: actions/configure-pages@v6
      - name: Rakenna sivusto
        run: python scripts/build_book.py --site-dir dist --output-file outputs/Paivan-sakeet.html
      - name: Siirrä vain rakennetut sivut
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Julkaise GitHub Pagesiin
        id: deployment
        uses: actions/deploy-pages@v5